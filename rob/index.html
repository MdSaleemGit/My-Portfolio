        let btnMakeRobot = document.querySelector("#btnMakeRobot");
        let setName = document.querySelector("#setName");
        let robotImage = document.querySelector("#robotImage");
        let parentElement = document.querySelector(".parentElement");


        class RobotCard {
            constructor(parentElement, picture, name) {
                this.parentElement = parentElement;
                this.picture = picture;
                this.name = name;

            }
            robotMethod() {

                let imagediv = document.createElement("div");
                imagediv.classList.add("card", "m-2", "mb-4");
                imagediv.style.width = "10rem";

                let img = document.createElement("img");
                img.classList.add("card-img-top", "py-2");
                img.alt = "robot picture";
                img.src = "robots/" + this.picture.files[0].name;

                let hdiv = document.createElement("div");
                hdiv.classList.add("card-body");

                let h5 = document.createElement("h5");
                h5.classList.add("card-title", "robotName", "text-center");
                h5.innerHTML = this.name.toUpperCase();

                hdiv.appendChild(h5);
                imagediv.appendChild(img);
                imagediv.appendChild(hdiv);
                parentElement.appendChild(imagediv);

            };

        }


        btnMakeRobot.addEventListener('click', () => {
            if (robotImage.value == "" || setName.value == "") {
                robotImage.classList.add("is-invalid");
                setName.classList.add("is-invalid");
            } else {
                let newrobotMethod = new RobotCard(parentElement, robotImage, setName.value);
                newrobotMethod.robotMethod();
                robotImage.value = "";
                setName.value = "";
            }



        })
